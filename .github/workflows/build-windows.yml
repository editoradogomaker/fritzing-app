name: Build Windows 64-bit

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release name used in the zip file name (e.g. 1.0.8b)"
        default: "develop"
  push:
    tags: ["v*"]

env:
  QT_VERSION: "6.8.3" # must stay within QT_LEAST/QT_MOST of phoenix.pro
  BOOST_VERSION: "1.85.0"
  # The .pri files look for these dependencies as siblings of the repo folder
  # (see pri/*detect.pri), so everything lives next to ./fritzing-app.
  # Bump DEPS_REV to invalidate the dependency cache.
  DEPS_REV: "1"

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: write # only used to attach the zip to a release on tag pushes
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          path: fritzing-app

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2022_64
          modules: qtserialport qt5compat # qt5compat is required by quazip
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare environment
        run: |
          # Git's /usr/bin/link would shadow MSVC's link.exe
          rm -f /usr/bin/link
          echo "WS=$(cygpath -m "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
          echo "QTDIR_M=$(cygpath -m "$QT_ROOT_DIR")" >> "$GITHUB_ENV"
          # gitversion.pri builds GIT_VERSION from this when CI is set
          echo "TRAVIS_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Cache dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            libgit2-1.7.1
            quazip-${{ env.QT_VERSION }}-1.4intuisphere
            Clipper1-6.4.2
            svgpp-1.3.1
            ngspice-42
            boost_root
            jom
          key: win64-deps-${{ env.DEPS_REV }}-qt${{ env.QT_VERSION }}-boost${{ env.BOOST_VERSION }}

      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$WS/_src" && cd "$WS/_src"
          fetch() { curl -fsSL --retry 3 -o "$2" "$1"; }

          # --- libgit2 (shared, so no extra system libs are needed at link time)
          fetch https://github.com/libgit2/libgit2/archive/refs/tags/v1.7.1.tar.gz libgit2.tar.gz
          # the test fixtures contain symlinks that cannot be created on Windows
          tar xzf libgit2.tar.gz --exclude='libgit2-1.7.1/tests'
          cmake -S libgit2-1.7.1 -B libgit2-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$WS/libgit2-1.7.1" -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DUSE_SSH=OFF -DUSE_HTTPS=WinHTTP \
            -DUSE_BUNDLED_ZLIB=ON -DSTATIC_CRT=OFF
          cmake --build libgit2-build --target install

          # --- quazip (uses Qt's own zlib, like the rest of the project)
          fetch https://github.com/stachenov/quazip/archive/refs/tags/v1.4.tar.gz quazip.tar.gz
          tar xzf quazip.tar.gz
          cmake -S quazip-1.4 -B quazip-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$WS/quazip-${QT_VERSION}-1.4intuisphere" \
            -DCMAKE_PREFIX_PATH="$QTDIR_M" -DQUAZIP_QT_MAJOR_VERSION=6 \
            -DQUAZIP_USE_QT_ZLIB=ON -DQUAZIP_BZIP2=OFF -DQUAZIP_ENABLE_TESTS=OFF
          cmake --build quazip-build --target install

          # --- Clipper 1 (static)
          fetch "https://sourceforge.net/projects/polyclipping/files/clipper_ver6.4.2.zip/download" clipper.zip
          7z x -y -oclipper clipper.zip > /dev/null
          CPP="$(dirname "$(find clipper -path '*cpp/CMakeLists.txt' | head -1)")"
          cmake -S "$CPP" -B clipper-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$WS/Clipper1-6.4.2" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build clipper-build --target install
          if [ ! -f "$WS/Clipper1-6.4.2/include/polyclipping/clipper.hpp" ]; then
            mkdir -p "$WS/Clipper1-6.4.2/include/polyclipping"
            cp "$CPP/clipper.hpp" "$WS/Clipper1-6.4.2/include/polyclipping/"
          fi

          # --- svgpp (headers only)
          fetch https://github.com/svgpp/svgpp/archive/refs/tags/v1.3.1.tar.gz svgpp.tar.gz
          tar xzf svgpp.tar.gz
          mv svgpp-1.3.1 "$WS/svgpp-1.3.1"

          # --- ngspice (official prebuilt shared library; headers + runtime)
          fetch "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/old-releases/42/ngspice-42_dll_64.7z/download" ngspice.7z
          7z x -y -ongspice ngspice.7z > /dev/null
          NG="$WS/ngspice-42"
          mkdir -p "$NG/include" "$NG/runtime/ngspice"
          cp -r "$(dirname "$(dirname "$(find ngspice -name sharedspice.h | head -1)")")"/. "$NG/include/"
          cp "$(find ngspice -name ngspice.dll | head -1)" "$NG/runtime/"
          cp "$(dirname "$(find ngspice -name analog.cm | head -1)")"/*.cm "$NG/runtime/ngspice/"
          test -f "$NG/include/ngspice/sharedspice.h"

          # --- Boost (headers only are used by Fritzing)
          B="boost_$(echo "$BOOST_VERSION" | tr . _)"
          fetch "https://archives.boost.io/release/${BOOST_VERSION}/source/$B.7z" boost.7z
          7z x -y -o"$WS" boost.7z "$B/boost" > /dev/null
          mv "$WS/$B" "$WS/boost_root"

          # --- jom (parallel nmake)
          fetch https://download.qt.io/official_releases/jom/jom_1_1_4.zip jom.zip
          7z x -y -o"$WS/jom" jom.zip > /dev/null

      - name: Build Fritzing
        working-directory: fritzing-app
        run: |
          set -euo pipefail
          lrelease phoenix.pro
          qmake CONFIG+=release boost_root="$WS/boost_root" phoenix.pro
          "$WS/jom/jom.exe" -f Makefile.Release -j"$NUMBER_OF_PROCESSORS"
          test -f "$WS/release64/Fritzing.exe"

      - name: Package
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-develop}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; fi
          NAME="fritzing-${VERSION}.windows.AMD64"
          echo "RELEASE_NAME=$NAME" >> "$GITHUB_ENV"

          cd "$WS"
          D="$NAME"
          mkdir "$D"
          cp release64/Fritzing.exe "$D/"
          cp libgit2-1.7.1/bin/git2.dll quazip-${QT_VERSION}-1.4intuisphere/bin/quazip1-qt6.dll "$D/"
          # also scan quazip so that Qt6Core5Compat.dll gets deployed
          windeployqt --release --no-translations --compiler-runtime --dir "$D" "$D/Fritzing.exe" "$D/quazip1-qt6.dll"
          cp ngspice-42/runtime/ngspice.dll "$D/"
          cp -r ngspice-42/runtime/ngspice "$D/ngspice"
          # ngspice.dll may depend on the OpenMP runtime
          cp "$VCToolsRedistDir"x64/Microsoft.VC*.OpenMP/vcomp140.dll "$D/" 2>/dev/null || true

          cd fritzing-app
          cp -r sketches help "../$D/"
          mkdir "../$D/translations"
          find translations -name '*.qm' -size +128c -exec cp {} "../$D/translations/" \;
          cp -r translations/syntax "../$D/translations/" 2>/dev/null || true
          cp README.md INSTALL.txt LICENSE.GPL2 LICENSE.GPL3 LICENSE.CC-BY-SA "../$D/"
          cd ..

          git clone --depth 1 --branch master https://github.com/fritzing/fritzing-parts.git "$D/fritzing-parts"
          rm -rf "$D/fritzing-parts/.git"

      - name: Generate parts.db
        continue-on-error: true # the app creates it on first start if this fails
        timeout-minutes: 10
        run: |
          cd "$WS/$RELEASE_NAME"
          ./Fritzing.exe -db "$PWD/fritzing-parts/parts.db" -pp "$PWD/fritzing-parts" -f "$PWD"

      - name: Zip
        run: |
          cd "$WS"
          7z a -tzip "$RELEASE_NAME.zip" "$RELEASE_NAME" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: ${{ env.RELEASE_NAME }}.zip
          if-no-files-found: error

      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_NAME }}.zip
